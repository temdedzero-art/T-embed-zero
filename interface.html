<script type="module">
import { ESPLoader, Transport } from 'https://unpkg.com/esptool-js@0.5.4/bundle.js';

// ⚙️ КОНФІГУРАЦІЯ
const GITHUB_REPO = 'tembedplus-droid/T-embed-zero';
const GITHUB_BRANCH = 'main';
const RAW_GITHUB_URL = `https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}`;

const BOARDS = {
  't-embed': {
    name: 'LilyGo T-Embed CC1101',
    chip: 'ESP32-S3',
    flashSize: '16MB',
    parts: [
      { name: 'Bootloader', path: `${RAW_GITHUB_URL}/t-embed/latest/bootloader.bin`, offset: 0x0 },
      { name: 'Partition Table', path: `${RAW_GITHUB_URL}/t-embed/latest/partition-table.bin`, offset: 0x8000 },
      { name: 'Flipper + Bruce v1.14', path: `${RAW_GITHUB_URL}/t-embed/latest/furi_esp32.bin`, offset: 0x10000 },
    ],
  },
  'waveshare-c6': {
    name: 'Waveshare ESP32-C6-LCD-1.9',
    chip: 'ESP32-C6',
    flashSize: '8MB',
    parts: [
      { name: 'Bootloader', path: `${RAW_GITHUB_URL}/waveshare-c6/latest/bootloader.bin`, offset: 0x0 },
      { name: 'Partition Table', path: `${RAW_GITHUB_URL}/waveshare-c6/latest/partition-table.bin`, offset: 0x8000 },
      { name: 'Flipper + Bruce v1.14', path: `${RAW_GITHUB_URL}/waveshare-c6/latest/furi_esp32.bin`, offset: 0x10000 },
    ],
  },
};

let selectedBoard = null;
let port = null;
let transport = null;

const $ = id => document.getElementById(id);

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function setError(msg) {
  const el = $('error-banner');
  if (msg) {
    el.textContent = msg;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function selectBoard(key) {
  console.log('selectBoard called with:', key);
  selectedBoard = BOARDS[key];
  setError(null);

  document.querySelectorAll('.board-card').forEach(c => c.classList.remove('selected'));
  $('board-' + key).classList.add('selected');

  $('connect-info').textContent = `Підключи ${selectedBoard.name} через USB`;
  $('connect-chip').innerHTML = `${selectedBoard.chip} &bull; USB-C &bull; WebSerial`;
  $('connect-btn').disabled = false;
  showScreen('screen-connect');
}

function setConnectState(state) {
  const btn = $('connect-btn');
  const spinner = $('connect-spinner');
  const btnText = $('connect-text');

  if (state === 'waiting') {
    btn.disabled = true;
    spinner.style.display = 'inline-block';
    btnText.textContent = 'Очікування на пристрій...';
  } else if (state === 'select') {
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = 'Вибрати пристрій';
    btn.classList.remove('flash-ready');
  } else if (state === 'connected') {
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = 'Прошити зараз';
    btn.classList.add('flash-ready');
  }
}

async function handleConnect() {
  const btn = $('connect-btn');

  if (btn.classList.contains('flash-ready')) {
    startFlash();
    return;
  }

  setError(null);
  setConnectState('waiting');

  try {
    port = await navigator.serial.requestPort();
    transport = new Transport(port, true);
    setConnectState('connected');
  } catch (e) {
    port = null;
    transport = null;
    if (e.name === 'NotFoundError') {
      setConnectState('select');
    } else {
      setError('Помилка підключення: ' + e.message);
      setConnectState('select');
    }
  }
}

async function startFlash() {
  showScreen('screen-flash');
  const progress = $('progress-bar');
  const progressText = $('progress-text');
  const board = selectedBoard;

  try {
    const esploader = new ESPLoader({
      transport,
      baudrate: 460800,
      romBaudrate: 115200,
      terminal: {
        clean() {},
        writeLine(data) { console.log(data); },
        write(data) { console.log(data); },
      },
    });

    progressText.textContent = 'Підключення до bootloader...';
    await esploader.main();
    await esploader.flashId();

    const fileArray = [];
    let totalSize = 0;

    for (const part of board.parts) {
      progressText.textContent = `Завантаження ${part.name}...`;
      console.log(`Завантажую з: ${part.path}`);
      
      const resp = await fetch(part.path);
      if (!resp.ok) {
        throw new Error(`Не можу завантажити ${part.name} (${resp.status}). URL: ${part.path}`);
      }
      
      const data = await resp.arrayBuffer();
      const bytes = new Uint8Array(data);
      fileArray.push({ data: binaryToStr(bytes), address: part.offset });
      totalSize += bytes.length;
      
      console.log(`✓ ${part.name}: ${bytes.length} bytes`);
    }

    progressText.textContent = `Прошивання ${(totalSize / 1024 / 1024).toFixed(1)} MB...`;

    await esploader.writeFlash({
      fileArray,
      flashSize: board.flashSize,
      flashMode: 'dio',
      flashFreq: '80m',
      eraseAll: false,
      compress: true,
      reportProgress: (idx, written, total) => {
        const pct = Math.round((written / total) * 100);
        progress.style.width = pct + '%';
        progressText.textContent = `Прошивання частини ${idx + 1}/${board.parts.length}... ${pct}%`;
      },
    });

    progressText.textContent = 'Перезавантаження пристрою...';
    await transport.setDTR(false);
    await transport.setRTS(true);
    await new Promise(r => setTimeout(r, 100));
    await transport.setRTS(false);
    await new Promise(r => setTimeout(r, 100));

    showScreen('screen-success');

  } catch (e) {
    console.error('Flash error:', e);
    setError('Помилка прошивання: ' + e.message);
    setConnectState('select');
    port = null;
    transport = null;
    showScreen('screen-connect');
  }
}

function binaryToStr(u8) {
  let str = '';
  for (let i = 0; i < u8.length; i++) str += String.fromCharCode(u8[i]);
  return str;
}

function goBack() {
  setError(null);
  port = null;
  transport = null;
  selectedBoard = null;
  const btn = $('connect-btn');
  btn.classList.remove('flash-ready');
  btn.disabled = true;
  setConnectState('select');
  showScreen('screen-board');
}

// ЕКСПОРТУЄМО ВСЕ ГЛОБАЛЬНО
window.selectBoard = selectBoard;
window.handleConnect = handleConnect;
window.goBack = goBack;

// Перевірка WebSerial підтримки
if (!('serial' in navigator)) {
  document.querySelectorAll('.board-card').forEach(c => c.style.pointerEvents = 'none');
  setError('Використовуй Google Chrome або Microsoft Edge на ПК для прошивання.');
}
</script>
